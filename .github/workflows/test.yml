name: Observability integration
on:
  # image.yml calls this workflow before it publishes an image.
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: observecontext
          persist-credentials: false
      - name: Install uv and build the Python client
        run: |
          python3 -m pip install uv==0.12.21
          uv build --directory observecontext --out-dir /tmp/observecontext-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify vendored official browser SDK
        working-directory: observecontext
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          git diff --exit-code -- web/pocketbase.es.mjs web/pocketbase.LICENSE.md
      - name: Test deployment orchestration
        run: python3 observecontext/tests/deploy_workflow.py
      - name: Python runtime safety
        run: python3 observecontext/tests/entrypoint.py
      - name: Read server revision
        id: server
        shell: bash
        run: |
          revision=$(cat observecontext/POCKETCONTEXT_VERSION)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pocketcontext/pocketcontext
          ref: ${{ steps.server.outputs.revision }}
          path: pocketcontext
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pocketcontext/go.mod
          cache-dependency-path: pocketcontext/go.sum
      - name: Build server
        working-directory: pocketcontext
        # The flags of pocketcontext's Makefile.
        run: CGO_ENABLED=1 go build -tags sqlite_math_functions -o bin/pocketcontext ./cmd/pocketcontext
      - name: Test trace ingestion and analysis
        run: python3 observecontext/tests/integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test migration of existing private operations
        run: python3 observecontext/tests/migration.py --binary pocketcontext/bin/pocketcontext
      - name: Test authentication and deployment settings
        run: python3 observecontext/tests/auth.py --binary pocketcontext/bin/pocketcontext
      - name: Test Google OAuth claims and Workspace signup
        run: python3 observecontext/tests/oauth_integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test realtime access and revocation
        run: python3 observecontext/tests/realtime_access.py --binary pocketcontext/bin/pocketcontext
      - name: Test first-start deployment settings
        run: python3 observecontext/tests/deploy.py --binary pocketcontext/bin/pocketcontext
      - name: Recovery comparison safety
        run: python3 observecontext/tests/recovery_compare.py
      - name: Primary file storage configuration
        run: python3 observecontext/tests/object_storage.py --binary pocketcontext/bin/pocketcontext
      - name: Install hosted dashboard browser tooling
        run: |
          npm install --prefix /tmp/observe-browser --no-audit --no-fund playwright@1.63.0
          /tmp/observe-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test hosted dashboard authentication, isolation and browser behavior
        run: python3 observecontext/tests/dashboard_hosted.py --binary pocketcontext/bin/pocketcontext --browser-module /tmp/observe-browser/node_modules/playwright
      - name: Test installable skill
        run: python3 observecontext/tests/skill.py --binary pocketcontext/bin/pocketcontext
      - name: Test OAuth client
        run: python3 observecontext/tests/oauth.py
      - name: Test client utilities and dashboard access
        run: python3 observecontext/tests/client.py
      - name: Test packaged subprocess instrumentation
        run: python3 observecontext/tests/instrumentation.py
      - name: Test private upload queue
        run: python3 observecontext/tests/upload.py
      - name: Test opt-in retrieval and upload retry end to end
        run: python3 observecontext/tests/upload_integration.py --binary pocketcontext/bin/pocketcontext
      - name: Test request tracing end to end
        run: python3 observecontext/tests/tracing.py --binary pocketcontext/bin/pocketcontext

      - name: Maintenance freeze and frozen startup
        run: |
          python3 observecontext/tests/maintenance.py --binary pocketcontext/bin/pocketcontext
